name: Moku
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.2"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
fileGroups:
  - README.md
  - LICENSE
  - moku-ios
  - Tools/CLI/Package.swift
  - Tools/CLI/Sources
  - Tools/CLI/Tests
  - Configuration
  - project.yml
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    'FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]': '$(inherited) $(SRCROOT)/Services/.build/Tsunagu.xcframework/ios-arm64-simulator'
    'FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]': '$(inherited) $(SRCROOT)/Services/.build/Tsunagu.xcframework/ios-arm64'
    SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Configuration/Tsunagu"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  Moku:
    type: application
    platform: iOS
    sources:
      - path: Moku
        createIntermediateGroups: true
        excludes:
          - "**/*.md"
      - path: Services/swift
    preBuildScripts:
      - name: Embed source runtime
        shell: /usr/bin/env -S xcrun --sdk macosx swift
        script: |
          import Foundation
          import Darwin
          let environment = ProcessInfo.processInfo.environment
          guard let root = environment["SRCROOT"] else { fatalError("Missing SRCROOT") }
          let process = Process()
          process.executableURL = URL(fileURLWithPath: environment["MOKU_IOS_TOOL"] ?? root + "/moku-ios")
          process.arguments = ["--repo", root, "embed-backend"]
          do {
              try process.run()
              process.waitUntilExit()
              exit(process.terminationStatus)
          } catch {
              FileHandle.standardError.write(Data("Runtime embedding failed: \(error)\n".utf8))
              exit(1)
          }
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moku.app
        DEVELOPMENT_TEAM: 7D6BVN4W87
        ARCHS: arm64
        # Static OpenJDK resolves JNI symbols in the main executable via RTLD_FIRST.
        # Moving them into Moku.debug.dylib crashes JVM bootstrap.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Configuration/Moku-Bridging-Header.h
        'FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]': '$(inherited) $(SRCROOT)/Services/.build/Tsunagu.xcframework/ios-arm64-simulator'
        'FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]': '$(inherited) $(SRCROOT)/Services/.build/Tsunagu.xcframework/ios-arm64'
        SWIFT_INCLUDE_PATHS: "$(inherited) $(SRCROOT)/Configuration/Tsunagu"
        'MOKU_BACKEND_PLATFORM[sdk=iphoneos*]': device
        'MOKU_BACKEND_PLATFORM[sdk=iphonesimulator*]': simulator
        OTHER_LDFLAGS: '$(inherited) -Wl,-export_dynamic -Wl,-force_load,$(SRCROOT)/Services/.build/native-$(MOKU_BACKEND_PLATFORM)/libtsunagu.a $(SRCROOT)/Services/.build/native-$(MOKU_BACKEND_PLATFORM)/libtsmedia.a -framework Foundation -framework Security -framework CoreFoundation -framework CFNetwork -framework VideoToolbox -framework CoreMedia -framework CoreVideo -framework AudioToolbox -lresolv -lz -lxml2 -lc++'
        INFOPLIST_FILE: Configuration/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Moku
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "**/*.md"
          - "UI/**"
    dependencies:
      - target: Moku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moku.app.tests
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        excludes:
          - "**/*.md"
    dependencies:
      - target: Moku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moku.app.uitests
schemes:
  Moku:
    build:
      targets:
        Moku: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - Tests
        - UITests
    archive:
      config: Release
